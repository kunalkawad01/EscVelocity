<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 410" fill="none">
  <!-- Background glow -->
  <circle cx="270" cy="200" r="185" fill="#6366f1" fill-opacity="0.04"/>
  <circle cx="270" cy="200" r="145" stroke="#94A3B8" stroke-opacity="0.07" stroke-width="1" fill="none"/>

  <!-- ── Edges (drawn before nodes) ─────────────────────────── -->

  <!-- 0 → 1 : Strong Uptrend → Volatile Bull -->
  <line x1="289" y1="80" x2="360" y2="120" stroke="#22c55e" stroke-opacity="0.50" stroke-width="2"/>
  <circle cx="360" cy="120" r="4" fill="#22c55e" fill-opacity="0.60"/>

  <!-- 1 → 2 : Volatile Bull → Sideways Quiet -->
  <line x1="382" y1="154" x2="382" y2="238" stroke="#84cc16" stroke-opacity="0.50" stroke-width="2"/>
  <circle cx="382" cy="238" r="4" fill="#84cc16" fill-opacity="0.60"/>

  <!-- 2 → 3 : Sideways Quiet → Sideways Volatile -->
  <line x1="362" y1="270" x2="290" y2="312" stroke="#94a3b8" stroke-opacity="0.50" stroke-width="2"/>
  <circle cx="290" cy="312" r="4" fill="#94a3b8" fill-opacity="0.60"/>

  <!-- 3 → 4 : Sideways Volatile → Steady Bear -->
  <line x1="250" y1="312" x2="178" y2="270" stroke="#f59e0b" stroke-opacity="0.50" stroke-width="2"/>
  <circle cx="178" cy="270" r="4" fill="#f59e0b" fill-opacity="0.60"/>

  <!-- 4 → 5 : Steady Bear → Volatile Bear -->
  <line x1="158" y1="238" x2="158" y2="154" stroke="#f97316" stroke-opacity="0.50" stroke-width="2"/>
  <circle cx="158" cy="154" r="4" fill="#f97316" fill-opacity="0.60"/>

  <!-- 5 → 0 : Volatile Bear → Strong Uptrend (recovery) -->
  <line x1="178" y1="122" x2="250" y2="82" stroke="#ef4444" stroke-opacity="0.50" stroke-width="2"/>
  <circle cx="250" cy="82" r="4" fill="#ef4444" fill-opacity="0.60"/>

  <!-- Long-range transitions (dashed) -->
  <!-- 0 ↔ 3 (regime reversal through center) -->
  <path d="M 270,92 C 318,165 318,240 270,312"
        stroke="#94A3B8" stroke-opacity="0.16" stroke-width="1" stroke-dasharray="5,4" fill="none"/>
  <!-- 5 → 2 (volatile bear → quiet recovery) -->
  <path d="M 168,118 Q 300,180 370,252"
        stroke="#ef4444" stroke-opacity="0.10" stroke-width="1" stroke-dasharray="3,4" fill="none"/>

  <!-- Self-loop on Node 0 (persistence in uptrend) -->
  <path d="M 256,50 A 30,24 0 1 1 286,50"
        stroke="#22c55e" stroke-opacity="0.55" stroke-width="1.8" fill="none"/>
  <polygon points="286,50 280,40 293,42" fill="#22c55e" fill-opacity="0.55"/>

  <!-- ── Nodes ───────────────────────────────────────────────── -->

  <!-- 0 — Strong Uptrend -->
  <circle cx="270" cy="70" r="24" fill="#22c55e" fill-opacity="0.12"/>
  <circle cx="270" cy="70" r="24" stroke="#22c55e" stroke-width="2.2"/>
  <text x="270" y="75" font-family="'Courier New',monospace" font-size="13"
        fill="#22c55e" text-anchor="middle" font-weight="700">0</text>
  <text x="270" y="112" font-family="'IBM Plex Sans',sans-serif" font-size="9"
        fill="#22c55e" fill-opacity="0.80" text-anchor="middle">Uptrend</text>

  <!-- 1 — Volatile Bull -->
  <circle cx="382" cy="132" r="24" fill="#84cc16" fill-opacity="0.12"/>
  <circle cx="382" cy="132" r="24" stroke="#84cc16" stroke-width="2.2"/>
  <text x="382" y="137" font-family="'Courier New',monospace" font-size="13"
        fill="#84cc16" text-anchor="middle" font-weight="700">1</text>
  <text x="382" y="174" font-family="'IBM Plex Sans',sans-serif" font-size="9"
        fill="#84cc16" fill-opacity="0.80" text-anchor="middle">Vol Bull</text>

  <!-- 2 — Sideways Quiet -->
  <circle cx="382" cy="260" r="24" fill="#94a3b8" fill-opacity="0.12"/>
  <circle cx="382" cy="260" r="24" stroke="#94a3b8" stroke-width="2.2"/>
  <text x="382" y="265" font-family="'Courier New',monospace" font-size="13"
        fill="#94a3b8" text-anchor="middle" font-weight="700">2</text>
  <text x="382" y="302" font-family="'IBM Plex Sans',sans-serif" font-size="9"
        fill="#94a3b8" fill-opacity="0.80" text-anchor="middle">Quiet</text>

  <!-- 3 — Sideways Volatile -->
  <circle cx="270" cy="324" r="24" fill="#f59e0b" fill-opacity="0.12"/>
  <circle cx="270" cy="324" r="24" stroke="#f59e0b" stroke-width="2.2"/>
  <text x="270" y="329" font-family="'Courier New',monospace" font-size="13"
        fill="#f59e0b" text-anchor="middle" font-weight="700">3</text>
  <text x="270" y="366" font-family="'IBM Plex Sans',sans-serif" font-size="9"
        fill="#f59e0b" fill-opacity="0.80" text-anchor="middle">Vol Side</text>

  <!-- 4 — Steady Bear -->
  <circle cx="158" cy="260" r="24" fill="#f97316" fill-opacity="0.12"/>
  <circle cx="158" cy="260" r="24" stroke="#f97316" stroke-width="2.2"/>
  <text x="158" y="265" font-family="'Courier New',monospace" font-size="13"
        fill="#f97316" text-anchor="middle" font-weight="700">4</text>
  <text x="158" y="302" font-family="'IBM Plex Sans',sans-serif" font-size="9"
        fill="#f97316" fill-opacity="0.80" text-anchor="middle">Bear</text>

  <!-- 5 — Volatile Bear -->
  <circle cx="158" cy="132" r="24" fill="#ef4444" fill-opacity="0.12"/>
  <circle cx="158" cy="132" r="24" stroke="#ef4444" stroke-width="2.2"/>
  <text x="158" y="137" font-family="'Courier New',monospace" font-size="13"
        fill="#ef4444" text-anchor="middle" font-weight="700">5</text>
  <text x="158" y="174" font-family="'IBM Plex Sans',sans-serif" font-size="9"
        fill="#ef4444" fill-opacity="0.80" text-anchor="middle">Vol Bear</text>

  <!-- ── Probability pills on select edges ──────────────────── -->

  <rect x="310" y="91" width="38" height="14" rx="5"
        fill="#22c55e" fill-opacity="0.12" stroke="#22c55e" stroke-opacity="0.28" stroke-width="0.8"/>
  <text x="329" y="102" font-family="'Courier New',monospace" font-size="8"
        fill="#22c55e" text-anchor="middle">42%</text>

  <rect x="392" y="187" width="38" height="14" rx="5"
        fill="#84cc16" fill-opacity="0.12" stroke="#84cc16" stroke-opacity="0.28" stroke-width="0.8"/>
  <text x="411" y="198" font-family="'Courier New',monospace" font-size="8"
        fill="#84cc16" text-anchor="middle">31%</text>

  <rect x="194" y="91" width="38" height="14" rx="5"
        fill="#ef4444" fill-opacity="0.12" stroke="#ef4444" stroke-opacity="0.28" stroke-width="0.8"/>
  <text x="213" y="102" font-family="'Courier New',monospace" font-size="8"
        fill="#ef4444" text-anchor="middle">38%</text>

  <!-- ── Decorative data-flow dots ──────────────────────────── -->
  <circle cx="325" cy="100" r="2.5" fill="#22c55e" fill-opacity="0.55"/>
  <circle cx="382" cy="196" r="2.5" fill="#84cc16" fill-opacity="0.55"/>
  <circle cx="213" cy="100" r="2.5" fill="#ef4444" fill-opacity="0.55"/>
</svg>
