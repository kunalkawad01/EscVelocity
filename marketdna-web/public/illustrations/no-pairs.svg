<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 300" fill="none">
  <!-- Soft background -->
  <circle cx="190" cy="150" r="125" fill="#94A3B8" fill-opacity="0.04"/>

  <!-- Document / clipboard body -->
  <rect x="75" y="32" width="200" height="230" rx="12"
        stroke="#94A3B8" stroke-opacity="0.40" stroke-width="2"
        fill="#94A3B8" fill-opacity="0.04"/>

  <!-- Clipboard header tab -->
  <rect x="122" y="18" width="106" height="30" rx="8"
        stroke="#94A3B8" stroke-opacity="0.35" stroke-width="2"
        fill="#94A3B8" fill-opacity="0.06"/>
  <circle cx="175" cy="33" r="5" stroke="#94A3B8" stroke-opacity="0.40" stroke-width="1.5"/>

  <!-- Dashed content lines (empty rows) -->
  <line x1="100" y1="85"  x2="252" y2="85"  stroke="#94A3B8" stroke-opacity="0.32" stroke-width="2" stroke-dasharray="8,5"/>
  <line x1="100" y1="110" x2="235" y2="110" stroke="#94A3B8" stroke-opacity="0.24" stroke-width="2" stroke-dasharray="8,5"/>
  <line x1="100" y1="135" x2="245" y2="135" stroke="#94A3B8" stroke-opacity="0.24" stroke-width="2" stroke-dasharray="8,5"/>
  <line x1="100" y1="160" x2="220" y2="160" stroke="#94A3B8" stroke-opacity="0.20" stroke-width="2" stroke-dasharray="8,5"/>
  <line x1="100" y1="185" x2="238" y2="185" stroke="#94A3B8" stroke-opacity="0.20" stroke-width="2" stroke-dasharray="8,5"/>
  <line x1="100" y1="210" x2="226" y2="210" stroke="#94A3B8" stroke-opacity="0.16" stroke-width="2" stroke-dasharray="8,5"/>

  <!-- Magnifying glass (overlapping bottom-right of document) -->
  <circle cx="268" cy="224" r="46"
          stroke="#94A3B8" stroke-opacity="0.45" stroke-width="2.5"
          fill="#94A3B8" fill-opacity="0.06"/>
  <line x1="302" y1="258" x2="336" y2="292" stroke="#94A3B8" stroke-opacity="0.42" stroke-width="4.5" stroke-linecap="round"/>

  <!-- X inside the glass (no results) -->
  <line x1="250" y1="206" x2="286" y2="242" stroke="#EF4444" stroke-opacity="0.58" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="286" y1="206" x2="250" y2="242" stroke="#EF4444" stroke-opacity="0.58" stroke-width="2.5" stroke-linecap="round"/>
</svg>
