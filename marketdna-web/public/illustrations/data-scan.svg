<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 280" fill="none">
  <defs>
    <clipPath id="glass-clip">
      <circle cx="145" cy="118" r="80"/>
    </clipPath>
  </defs>

  <!-- Soft background glow -->
  <circle cx="145" cy="118" r="140" fill="#34D399" fill-opacity="0.04"/>

  <!-- Magnifying glass — lens fill -->
  <circle cx="145" cy="118" r="80" fill="#34D399" fill-opacity="0.07"/>

  <!-- Chart inside the lens, clipped to the circle -->
  <g clip-path="url(#glass-clip)">
    <!-- Inner grid -->
    <line x1="75"  y1="175" x2="215" y2="175" stroke="#94A3B8" stroke-opacity="0.25" stroke-width="0.8"/>
    <line x1="75"  y1="150" x2="215" y2="150" stroke="#94A3B8" stroke-opacity="0.18" stroke-width="0.8"/>
    <line x1="75"  y1="125" x2="215" y2="125" stroke="#94A3B8" stroke-opacity="0.18" stroke-width="0.8"/>
    <line x1="75"  y1="100" x2="215" y2="100" stroke="#94A3B8" stroke-opacity="0.18" stroke-width="0.8"/>
    <!-- Bars -->
    <rect x="83"  y="142" width="16" height="33" rx="3" fill="#34D399" fill-opacity="0.65"/>
    <rect x="104" y="122" width="16" height="53" rx="3" fill="#34D399" fill-opacity="0.80"/>
    <rect x="125" y="132" width="16" height="43" rx="3" fill="#818CF8" fill-opacity="0.70"/>
    <rect x="146" y="108" width="16" height="67" rx="3" fill="#34D399"/>
    <rect x="167" y="127" width="16" height="48" rx="3" fill="#818CF8" fill-opacity="0.70"/>
    <rect x="188" y="118" width="16" height="57" rx="3" fill="#34D399" fill-opacity="0.80"/>
    <!-- Trend line over bars -->
    <path d="M 91,138 L 112,118 L 133,128 L 154,104 L 175,122 L 196,113"
          stroke="#34D399" stroke-width="2" stroke-dasharray="3,2" stroke-linecap="round" fill="none"/>
    <!-- Trend line dots -->
    <circle cx="91"  cy="138" r="3" fill="#34D399"/>
    <circle cx="154" cy="104" r="3" fill="#34D399"/>
    <circle cx="196" cy="113" r="3" fill="#34D399"/>
  </g>

  <!-- Lens border (drawn on top of clip group) -->
  <circle cx="145" cy="118" r="80" stroke="#34D399" stroke-width="3"/>

  <!-- Handle -->
  <line x1="208" y1="181" x2="290" y2="263" stroke="#34D399" stroke-width="5.5" stroke-linecap="round"/>

  <!-- Sparkle dots around lens -->
  <circle cx="145" cy="26"  r="5"   fill="#34D399" fill-opacity="0.80"/>
  <circle cx="172" cy="30"  r="3.5" fill="#34D399" fill-opacity="0.50"/>
  <circle cx="118" cy="30"  r="3.5" fill="#34D399" fill-opacity="0.50"/>
  <circle cx="198" cy="42"  r="3"   fill="#34D399" fill-opacity="0.32"/>
  <circle cx="92"  cy="42"  r="3"   fill="#34D399" fill-opacity="0.32"/>
  <circle cx="56"  cy="80"  r="4"   fill="#818CF8" fill-opacity="0.30"/>
  <circle cx="234" cy="80"  r="4"   fill="#818CF8" fill-opacity="0.30"/>
  <circle cx="40"  cy="118" r="3"   fill="#34D399" fill-opacity="0.22"/>
  <circle cx="250" cy="118" r="3"   fill="#34D399" fill-opacity="0.22"/>

  <!-- Loading dots -->
  <circle cx="126" cy="248" r="5.5" fill="#34D399" fill-opacity="0.80"/>
  <circle cx="145" cy="248" r="5.5" fill="#34D399" fill-opacity="0.50"/>
  <circle cx="164" cy="248" r="5.5" fill="#34D399" fill-opacity="0.28"/>
</svg>
