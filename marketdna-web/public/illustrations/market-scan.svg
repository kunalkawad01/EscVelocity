<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 280" fill="none">
  <!-- Background glow -->
  <circle cx="170" cy="140" r="145" fill="#8b5cf6" fill-opacity="0.05"/>

  <!-- ── Radar screen ──────────────────────────────────────── -->

  <!-- Outer ring -->
  <circle cx="170" cy="140" r="112" stroke="#8b5cf6" stroke-opacity="0.22" stroke-width="1.5" fill="none"/>
  <!-- Mid ring -->
  <circle cx="170" cy="140" r="75"  stroke="#8b5cf6" stroke-opacity="0.18" stroke-width="1" fill="none"/>
  <!-- Inner ring -->
  <circle cx="170" cy="140" r="40"  stroke="#8b5cf6" stroke-opacity="0.22" stroke-width="1" fill="none"/>

  <!-- Cross-hairs -->
  <line x1="170" y1="28"  x2="170" y2="252" stroke="#8b5cf6" stroke-opacity="0.12" stroke-width="1"/>
  <line x1="58"  y1="140" x2="282" y2="140" stroke="#8b5cf6" stroke-opacity="0.12" stroke-width="1"/>
  <!-- Diagonal guides -->
  <line x1="91"  y1="61"  x2="249" y2="219" stroke="#8b5cf6" stroke-opacity="0.07" stroke-width="1"/>
  <line x1="249" y1="61"  x2="91"  y2="219" stroke="#8b5cf6" stroke-opacity="0.07" stroke-width="1"/>

  <!-- ── Sweep sector (violet filled wedge at ~40° clockwise from top) ── -->
  <!-- Arc from center at angle 40° spanning 60°. Computed endpoints:
       Start angle 40°: x=170+112*sin(40°)=170+72=242, y=140-112*cos(40°)=140-86=54
       End angle 100°: x=170+112*sin(100°)=170+110=280, y=140-112*cos(100°)=140+19=159 -->
  <path d="M 170,140 L 242,54 A 112,112 0 0 1 280,159 Z"
        fill="#8b5cf6" fill-opacity="0.08"/>
  <!-- Sweep leading edge (brighter line) -->
  <line x1="170" y1="140" x2="280" y2="159"
        stroke="#8b5cf6" stroke-opacity="0.55" stroke-width="1.5"/>
  <!-- Sweep trailing fade line -->
  <line x1="170" y1="140" x2="242" y2="54"
        stroke="#8b5cf6" stroke-opacity="0.25" stroke-width="1"/>

  <!-- ── Stock dots scattered across the radar field ─────────── -->

  <!-- Highlighted (inside the sweep sector — "being scanned") -->
  <circle cx="248" cy="88"  r="5" fill="#8b5cf6" fill-opacity="0.90"/>
  <circle cx="265" cy="120" r="5" fill="#8b5cf6" fill-opacity="0.90"/>
  <circle cx="252" cy="154" r="4" fill="#8b5cf6" fill-opacity="0.75"/>
  <!-- Highlight ring (ping effect) -->
  <circle cx="248" cy="88"  r="9"  stroke="#8b5cf6" stroke-opacity="0.35" stroke-width="1" fill="none"/>
  <circle cx="265" cy="120" r="9"  stroke="#8b5cf6" stroke-opacity="0.35" stroke-width="1" fill="none"/>

  <!-- Normal dots (already scanned / outside sweep) -->
  <circle cx="170" cy="78"  r="4" fill="#22c55e" fill-opacity="0.70"/>  <!-- uptrend -->
  <circle cx="210" cy="95"  r="3.5" fill="#22c55e" fill-opacity="0.60"/>
  <circle cx="138" cy="70"  r="3.5" fill="#84cc16" fill-opacity="0.65"/>
  <circle cx="112" cy="100" r="4" fill="#94a3b8" fill-opacity="0.65"/>  <!-- quiet -->
  <circle cx="200" cy="175" r="4" fill="#f59e0b" fill-opacity="0.65"/>  <!-- vol side -->
  <circle cx="148" cy="185" r="3.5" fill="#f97316" fill-opacity="0.65"/>
  <circle cx="230" cy="185" r="3.5" fill="#f59e0b" fill-opacity="0.60"/>
  <circle cx="100" cy="148" r="4" fill="#ef4444" fill-opacity="0.65"/>  <!-- vol bear -->
  <circle cx="125" cy="175" r="3.5" fill="#f97316" fill-opacity="0.60"/>
  <circle cx="170" cy="196" r="4" fill="#94a3b8" fill-opacity="0.60"/>
  <circle cx="205" cy="105" r="3.5" fill="#22c55e" fill-opacity="0.55"/>
  <circle cx="130" cy="118" r="3.5" fill="#22c55e" fill-opacity="0.55"/>
  <circle cx="155" cy="100" r="3"   fill="#84cc16" fill-opacity="0.50"/>
  <circle cx="218" cy="148" r="3.5" fill="#94a3b8" fill-opacity="0.55"/>

  <!-- Centre dot (origin) -->
  <circle cx="170" cy="140" r="4" fill="#8b5cf6" fill-opacity="0.80"/>
  <circle cx="170" cy="140" r="8" stroke="#8b5cf6" stroke-opacity="0.30" stroke-width="1" fill="none"/>

  <!-- ── Corner stat pill ────────────────────────────────────── -->
  <rect x="18" y="248" width="90" height="20" rx="6"
        fill="#8b5cf6" fill-opacity="0.10" stroke="#8b5cf6" stroke-opacity="0.25" stroke-width="1"/>
  <text x="63" y="262" font-family="'Courier New',monospace" font-size="9"
        fill="#8b5cf6" text-anchor="middle">50 symbols</text>

  <rect x="232" y="248" width="90" height="20" rx="6"
        fill="#8b5cf6" fill-opacity="0.10" stroke="#8b5cf6" stroke-opacity="0.25" stroke-width="1"/>
  <text x="277" y="262" font-family="'Courier New',monospace" font-size="9"
        fill="#8b5cf6" text-anchor="middle">~30–60 s</text>
</svg>
