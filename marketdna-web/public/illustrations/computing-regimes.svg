  <!-- Bottom-left -->
  <circle cx="84" cy="214" r="10" fill="#6366f1" fill-opacity="0.10"/>
  <circle cx="84" cy="214" r="10" stroke="#6366f1" stroke-opacity="0.55" stroke-width="1.5"/>

