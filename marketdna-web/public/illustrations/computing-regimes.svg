  <circle cx="225" cy="102" r="3" fill="#6366f1" fill-opacity="0.60"/>
  <circle cx="238" cy="146" r="3" fill="#6366f1" fill-opacity="0.55"/>
  <circle cx="214" cy="196" r="3" fill="#6366f1" fill-opacity="0.45"/>
  <circle cx="110" cy="178" r="3" fill="#6366f1" fill-opacity="0.40"/>
