  <circle cx="170" cy="140" r="36" fill="#6366f1" fill-opacity="0.08"/>
  <circle cx="170" cy="140" r="28" fill="#6366f1" fill-opacity="0.14"/>
  <circle cx="170" cy="140" r="28" stroke="#6366f1" stroke-width="2.5"/>
  <!-- Inner CPU grid lines -->
  <line x1="158" y1="128" x2="182" y2="128" stroke="#6366f1" stroke-opacity="0.55" stroke-width="1"/>
  <line x1="158" y1="140" x2="182" y2="140" stroke="#6366f1" stroke-opacity="0.55" stroke-width="1"/>
  <line x1="158" y1="152" x2="182" y2="152" stroke="#6366f1" stroke-opacity="0.55" stroke-width="1"/>
  <line x1="162" y1="124" x2="162" y2="156" stroke="#6366f1" stroke-opacity="0.55" stroke-width="1"/>
  <line x1="170" y1="124" x2="170" y2="156" stroke="#6366f1" stroke-opacity="0.55" stroke-width="1"/>
  <line x1="178" y1="124" x2="178" y2="156" stroke="#6366f1" stroke-opacity="0.55" stroke-width="1"/>
