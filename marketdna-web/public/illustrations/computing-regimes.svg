  <line x1="88" y1="210" x2="60" y2="130" stroke="#94A3B8" stroke-opacity="0.16" stroke-width="1"/>
  <line x1="60" y1="130" x2="82" y2="66" stroke="#94A3B8" stroke-opacity="0.20" stroke-width="1"/>

